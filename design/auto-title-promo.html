<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>会话自动命名 · 效果图（hero）</title>
<style>
  :root {
    --rose-1: #fb7185;
    --rose-2: #e11d48;
    --ink: #101014;
    --ink-2: #5c5c66;
    --ink-3: #9a9aa3;
    --card: #ffffff;
    --line: #ececef;
    --soft: #f6f6f7;
    --t1: #ffe4e6;
    --t2: #e0f2fe;
    --t3: #ede9fe;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(900px 520px at 16% -12%, rgba(251, 113, 133, 0.28), transparent 62%),
      radial-gradient(760px 460px at 92% 8%, rgba(225, 29, 72, 0.18), transparent 60%),
      #0b0b0e;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 56px 64px;
  }
  .card {
    width: 100%;
    max-width: 1460px;
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 30px;
    padding: 44px 52px 40px;
    box-shadow: 0 36px 90px rgba(0, 0, 0, 0.5);
  }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
  .kicker { font-size: 21px; font-weight: 650; letter-spacing: 0.01em; color: var(--ink); }
  .kicker small { display: block; margin-top: 4px; font-size: 15px; font-weight: 500; color: var(--ink-3); }
  .pill {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 10px 18px; border-radius: 999px;
    background: #fee2e6; color: #9f1239;
    font-size: 16px; font-weight: 600; white-space: nowrap;
  }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--rose-2); }
  h1 {
    margin: 30px 0 10px;
    font-size: 62px; line-height: 1.12; letter-spacing: -0.015em;
    font-weight: 750; color: var(--ink);
  }
  h1 em {
    font-style: normal;
    background: linear-gradient(100deg, var(--rose-1), var(--rose-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 0 0 34px; font-size: 24px; color: var(--ink-2); font-weight: 500; }

  .compare { display: grid; grid-template-columns: 1fr 92px 1.24fr; align-items: stretch; }
  .col { border-radius: 20px; }
  .old { background: var(--soft); border: 1px solid var(--line); padding: 20px 22px 22px; }
  .new { padding: 0; }
  .col-title { font-size: 17px; font-weight: 650; color: var(--ink-3); margin: 0 4px 16px; }
  .new .col-title { color: var(--ink); padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  .row {
    height: 62px; display: flex; align-items: center; padding: 0 18px;
    font-size: 27px; color: #b3b3bb; letter-spacing: 0.01em;
  }
  .old .row + .row { border-top: 1px dashed #e6e6ea; }
  .new .row {
    margin-bottom: 12px; border-radius: 14px; color: var(--ink);
    font-size: 29px; font-weight: 500;
  }
  .new .row:last-child { margin-bottom: 0; }
  .new .row .emoji { margin-right: 12px; font-size: 30px; }
  .new .row b { font-weight: 650; }
  .new .row span { color: #71717a; }
  .r1 { background: var(--t1); }
  .r2 { background: var(--t2); }
  .r3 { background: var(--t3); }

  .arrows { display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 34px; }
  .arrows svg { width: 52px; height: 24px; color: var(--rose-1); }

  .foot {
    margin-top: 30px; padding-top: 22px; border-top: 1px solid var(--line);
    font-size: 18px; color: var(--ink-3); letter-spacing: 0.01em;
  }
  .foot b { color: var(--ink-2); font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <div class="kicker">会话自动命名<small>CC GUI 插件 · auto-title</small></div>
      <span class="pill"><i></i>本机 CLI 命名 · 不配置密钥</span>
    </div>

    <h1>会话标题实时命名，<em>一眼认出在聊什么</em>。</h1>
    <p class="sub">emoji 分类 + 对象｜目标，侧栏不再是一排「你好」「继续修改」。</p>

    <div class="compare">
      <div class="col old">
        <div class="col-title">原来的标题</div>
        <div class="row">你好</div>
        <div class="row">帮我看一下</div>
        <div class="row">继续修改</div>
      </div>

      <div class="arrows">
        <svg viewBox="0 0 56 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12h46" /><path d="M38 3l10 9-10 9" />
        </svg>
        <svg viewBox="0 0 56 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12h46" /><path d="M38 3l10 9-10 9" />
        </svg>
        <svg viewBox="0 0 56 24" fill="none" stroke="currentColor" stroke-width="3"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12h46" /><path d="M38 3l10 9-10 9" />
        </svg>
      </div>

      <div class="col new">
        <div class="col-title">现在，一眼认出正在做什么</div>
        <div class="row r1"><span class="emoji">🧩</span><b>邮箱验证码</b>&nbsp;&nbsp;<span>｜&nbsp;&nbsp;过期排查</span></div>
        <div class="row r2"><span class="emoji">🎬</span><b>图像模型对比</b>&nbsp;&nbsp;<span>｜&nbsp;&nbsp;视频策划</span></div>
        <div class="row r3"><span class="emoji">🎨</span><b>登录表单</b>&nbsp;&nbsp;<span>｜&nbsp;&nbsp;布局优化</span></div>
      </div>
    </div>

    <div class="foot">
      每轮结束后自动判断 · 参考最近 <b>3~5 轮</b> · 不覆盖你手动改的名字 · 支持 claude / codex / gemini / omp / pi / deepseek
    </div>
  </div>
</body>
</html>
